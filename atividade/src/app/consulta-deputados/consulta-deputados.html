<section class="consulta-deputados">
  <h2>Lista de Deputados</h2>

  @if (!deputados()) {
    <p>Carregando deputados...</p>
  }
  @if (deputados()?.length === 0) {
    <p>Nenhum deputado encontrado.</p>
  }
  @if (deputados()?.length) {
    <ul>
      @for (item of deputados(); track item.id) {
        <li>
          <strong>{{ item.nome }}</strong>
          <span>{{ item.siglaPartido }} - {{ item.siglaUf }}</span>
        </li>
      }
    </ul>
  }
</section>
